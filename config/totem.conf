CONFIG_ZMK_USB_LOGGING=n

# Report both halves' battery levels to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Power off after 30 minutes without a key press (not while on USB power).
# A key press on a half wakes that half; the waking press is not typed.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
