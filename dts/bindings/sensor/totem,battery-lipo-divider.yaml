description: LiPo battery state of charge via voltage divider and discharge curve

compatible: "totem,battery-lipo-divider"

include: voltage-divider.yaml

properties:
  voltage-scale-permille:
    type: int
    default: 1000
    description: |
      Per-board correction for the divider resistors' tolerance and the ADC's
      gain error, in thousandths: readings are multiplied by this / 1000 before
      the curve lookup. 1000 means no correction; 1037 means the board reads
      3.7% low. It belongs to the controller board, not the battery.
